<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Atölye</title>
<style>
:root{--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--mute:#6E6E73;--line:rgba(0,0,0,.1);--acc:#0071E3;--accink:#fff;--fill:rgba(120,120,128,.12);--seg:#fff;--tint:rgba(0,113,227,.08);--err:#D70015;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1C1C1E;--ink:#F5F5F7;--mute:#98989D;--line:rgba(255,255,255,.14);--acc:#2997FF;--accink:#fff;--fill:rgba(120,120,128,.36);--seg:#636366;--tint:rgba(41,151,255,.14);--err:#FF453A;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1C1C1E;--ink:#F5F5F7;--mute:#98989D;--line:rgba(255,255,255,.14);--acc:#2997FF;--accink:#fff;--fill:rgba(120,120,128,.36);--seg:#636366;--tint:rgba(41,151,255,.14);--err:#FF453A;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:56px 20px 64px}
header{text-align:center;margin-bottom:32px}
h1{font:700 clamp(38px,8vw,56px)/1.05 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;letter-spacing:-.035em;margin:0 0 12px}
.sub{color:var(--mute);margin:0 auto;max-width:34ch;font-size:19px;line-height:1.4}
.segwrap{display:flex;justify-content:center;margin-bottom:24px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tab{border:0;background:var(--fill);color:var(--ink);padding:8px 15px;border-radius:980px;font-size:15px;font-weight:500;line-height:1.3;font-family:inherit;cursor:pointer;transition:background .2s,color .2s}
.tab[aria-selected=true]{background:var(--acc);color:var(--accink);font-weight:600}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--sh)}
.drop{display:grid;justify-items:center;gap:4px;border:1.5px dashed var(--line);border-radius:16px;padding:36px 16px;text-align:center;color:var(--mute);cursor:pointer;transition:background .2s,border-color .2s}
.drop.over,.drop:hover{background:var(--tint);border-color:var(--acc)}
.drop svg{width:44px;height:44px;color:var(--acc);margin-bottom:8px}
.drop b{color:var(--ink);font-size:19px;font-weight:600;letter-spacing:-.01em}
.drop span{font-size:15px}
ul{list-style:none;margin:18px 0 0;padding:0;background:var(--bg);border-radius:14px;overflow:hidden}
ul:empty{display:none}
li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li small{color:var(--mute);white-space:nowrap;font-size:14px}
.ib{border:0;background:var(--fill);color:var(--acc);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;font-weight:600;display:grid;place-items:center}
.ib:disabled{opacity:.3;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.row:empty{display:none}
label{display:grid;gap:6px;font-weight:600;font-size:14px;color:var(--mute);width:100%}
input[type=text],input[type=password],select{font-size:17px;font-family:inherit;padding:12px 14px;border:0;border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.act{display:grid;justify-items:center;margin-top:24px;gap:10px}
.go{background:var(--acc);color:var(--accink);border:0;border-radius:980px;padding:13px 32px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;min-width:200px;transition:opacity .2s,transform .1s}
.go:active:not(:disabled){transform:scale(.98)}
.go:disabled{opacity:.35;cursor:default}
.msg{min-height:22px;color:var(--mute);font-size:15px;text-align:center}
.msg.err{color:var(--err)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.priv{margin:22px 0 0;font-size:13px;color:var(--mute);text-align:center}
[hidden]{display:none!important}
.sigbox{display:grid;gap:10px;width:100%}
.sigbox .seg{display:flex;gap:6px}
.sigbox .seg button,.sigclr{border:0;background:var(--fill);color:var(--ink);padding:7px 14px;border-radius:980px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.sigbox .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sigbox canvas{width:100%;height:160px;background:#fff;border:1.5px dashed var(--line);border-radius:14px;touch-action:none;cursor:crosshair}
.sigbox .bot{display:flex;justify-content:space-between;align-items:center;font-weight:400;font-size:13px;color:var(--mute)}
.bar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#E5322D;color:#fff;font-style:normal;font-size:11px;font-weight:800}
.wrap{max-width:1040px}
.hero{padding:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 26px}
.chip{border:0;background:var(--fill);color:var(--ink);padding:8px 16px;border-radius:980px;font:500 15px inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tc{display:grid;gap:6px;align-content:start;background:var(--card);border-radius:16px;padding:20px;text-decoration:none;color:var(--ink);box-shadow:var(--sh);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.tc:hover{transform:translateY(-2px);border-color:var(--c)}
.tc b{font-size:18px;font-weight:650;letter-spacing:-.01em}
.tc span.d{font-size:14.5px;color:var(--mute);line-height:1.4}
.ti{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--c);color:#fff;margin-bottom:6px}
.ti svg{width:24px;height:24px}
.back{display:inline-block;color:var(--acc);text-decoration:none;font-weight:500;margin-bottom:14px}
.thead{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.thead h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.15}
.thead p{margin:2px 0 0;color:var(--mute)}
.thead .ti{margin:0;flex:none}
.theme{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--sh);cursor:pointer;display:grid;place-items:center;z-index:20}
.theme svg{width:22px;height:22px}
@media (max-width:640px){.theme{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none}}
.madeby{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--card);color:var(--mute);border:1px solid var(--line);box-shadow:var(--sh);border-radius:10px;padding:6px 11px;font-size:12px;font-weight:500;pointer-events:none}
.madeby b{color:var(--ink);font-weight:650}
<body>
<div class="bar"><a class="logo" href="#"><i>PDF</i>PDF Atölye</a></div>
<div class="wrap">
  <section id="home">
    <header class="hero">
      <h1>Her PDF aracı tek yerde</h1>
      <p class="sub">Birleştir, böl, sıkıştır, dönüştür, imzala, şifrele. Dosyaların cihazından çıkmaz.</p>
    </header>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="toolview" hidden>
    <a class="back" href="#">← Tüm araçlar</a>
    <div class="thead"><span class="ti" id="tIco"></span><div><h2 id="tTitle"></h2><p id="tDesc"></p></div></div>
    <div class="card">
      <div class="drop" id="drop" tabindex="0" role="button">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M28 6H14a4 4 0 0 0-4 4v28a4 4 0 0 0 4 4h20a4 4 0 0 0 4-4V16z"/><path d="M28 6v10h10"/><path d="M24 34V24m-5 5 5-5 5 5"/></svg>
        <b id="dropTitle"></b><span id="dropHint"></span>
      </div>
      <input type="file" id="pick" hidden>
      <ul id="list"></ul>
      <div class="row" id="opts"></div>
      <div class="act">
        <button class="go" id="go" disabled></button>
        <div class="msg" id="msg" role="status"></div>
      </div>
    </div>
  </section>
  <p class="priv">İşlem cihazında yapılır; dosyaların hiçbir sunucuya yüklenmez. OCR, PowerPoint → PDF ve HTML → PDF bu sürümde yok.</p>
</div>
<button class="theme" id="theme" aria-label="Koyu / açık mod"></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const { PDFDocument, degrees, StandardFonts, rgb } = PDFLib;
const PJ="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
const PDFA=".pdf,application/pdf", AP="Sayfa aralığı";
const T=(label,title,hint,go,out,o={})=>({label,title,hint,go,out,accept:PDFA,multi:false,...o});
const TOOLS={
 merge:T("Birleştir","PDF’leri seç ya da buraya bırak","Birden fazla PDF; sırayı oklarla değiştir","PDF’leri birleştir","birlesmis.pdf",{multi:true}),
 split:T("Böl / Ayıkla","Bir PDF seç ya da buraya bırak","Seçtiğin sayfalardan yeni bir PDF çıkarır","Sayfaları ayıkla","ayiklanmis.pdf",{opts:[{id:"range",label:AP,ph:"örn. 1-3, 5, 8-10"}]}),
 remove:T("Sayfa sil","Bir PDF seç ya da buraya bırak","Seçtiğin sayfalar silinir, kalanlar korunur","Sayfaları sil","kalan.pdf",{opts:[{id:"range",label:"Silinecek sayfalar",ph:"örn. 2, 4-6"}]}),
 organize:T("Sırala","Bir PDF seç ya da buraya bırak","Sayfaları yeni sıraya diz; yazmadığın sayfalar çıkar","Sırala","siralanmis.pdf",{opts:[{id:"range",label:"Yeni sıra",ph:"örn. 3, 1, 2"}]}),
 rotate:T("Döndür","Bir PDF seç ya da buraya bırak","Sayfaları aynı yönde döndürür","PDF’yi döndür","dondurulmus.pdf",{opts:[{id:"deg",label:"Yön",sel:[["90","90° sağa"],["180","180°"],["270","90° sola"]]},{id:"range",label:"Sayfalar (boşsa hepsi)",ph:"örn. 1-2"}]}),
 numbers:T("Sayfa numarası","Bir PDF seç ya da buraya bırak","Her sayfaya numara ekler","Numaraları ekle","numarali.pdf",{opts:[{id:"pos",label:"Konum",sel:[["c","Alt orta"],["r","Alt sağ"],["l","Alt sol"]]},{id:"start",label:"İlk numara",val:"1"},{id:"fmt",label:"Biçim",sel:[["n","1"],["t","1 / Toplam"]]}]}),
 watermark:T("Filigran","Bir PDF seç ya da buraya bırak","Her sayfaya çapraz metin ekler","Filigran ekle","filigranli.pdf",{opts:[{id:"wm",label:"Metin",val:"GİZLİ"},{id:"op",label:"Koyuluk",sel:[["0.15","Hafif"],["0.3","Orta"],["0.5","Belirgin"]]}]}),
 text:T("Metin ekle","Bir PDF seç ya da buraya bırak","Sayfalara istediğin yazıyı ekler","Metni ekle","metinli.pdf",{opts:[{id:"txt",label:"Metin",ph:"örn. Onaylandı – 05.11.2026"},{id:"range",label:"Sayfalar (boşsa hepsi)",ph:"örn. 1, 3-4"},{id:"tpos",label:"Konum",sel:[["tl","Üst sol"],["tc","Üst orta"],["tr","Üst sağ"],["c","Orta"],["bl","Alt sol"],["bc","Alt orta"],["br","Alt sağ"]]},{id:"tsz",label:"Boyut",sel:[["12","12 pt"],["16","16 pt"],["24","24 pt"],["36","36 pt"]]},{id:"tcol",label:"Renk",sel:[["0,0,0","Siyah"],["0.85,0.1,0.1","Kırmızı"],["0.05,0.3,0.8","Mavi"]]}]}),
 crop:T("Kırp","Bir PDF seç ya da buraya bırak","Her sayfanın kenarlarından eşit pay keser","PDF’yi kırp","kirpilmis.pdf",{opts:[{id:"m",label:"Her kenardan kesilecek (pt)",val:"20"}]}),
 img:T("Görselden PDF","JPG ya da PNG seç ya da buraya bırak","Her görsel bir sayfa olur; sırayı oklarla değiştir","PDF oluştur","gorseller.pdf",{accept:".jpg,.jpeg,.png,image/jpeg,image/png",multi:true}),
 pdf2jpg:T("PDF → JPG","Bir PDF seç ya da buraya bırak","Her sayfa bir JPG olur, hepsi ZIP içinde iner","JPG’lere çevir","sayfalar.zip"),
 pdf2xls:T("PDF → Excel","Bir PDF seç ya da buraya bırak","Tablo ve metinleri satır/sütun olarak .xlsx dosyasına aktarır","Excel’e çevir","tablo.xlsx",{opts:[{id:"mode",label:"Çalışma sayfası",sel:[["each","Her PDF sayfası ayrı çalışma sayfası"],["one","Hepsi tek çalışma sayfasında"]]}]}),
 xls2pdf:T("Excel → PDF","Excel ya da CSV dosyası seç ya da buraya bırak",".xlsx, .xls, .ods ve .csv; her çalışma sayfası tablo olarak PDF’ye dökülür","PDF’ye çevir","tablo.pdf",{accept:".xlsx,.xls,.xlsm,.ods,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv",ext:/\.(xlsx|xlsm|xls|ods|csv)$/i,opts:[{id:"orient",label:"Sayfa yönü",sel:[["auto","Otomatik"],["p","Dikey"],["l","Yatay"]]},{id:"head",label:"İlk satır",sel:[["1","Başlık (her sayfada tekrarlanır)"],["0","Normal satır"]]}]}),
 pdf2word:T("PDF → Word","Bir PDF seç ya da buraya bırak","Metni paragraflarıyla düzenlenebilir .docx dosyasına aktarır","Word’e çevir","belge.docx"),
 word2pdf:T("Word → PDF","Bir Word dosyası (.docx) seç ya da buraya bırak","Başlık, paragraf, liste, tablo ve görseller PDF’ye aktarılır","PDF’ye çevir","belge.pdf",{accept:".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document",ext:/\.docx$/i}),
 pdf2ppt:T("PDF → PowerPoint","Bir PDF seç ya da buraya bırak","Her sayfa bir slayt olur (.pptx)","PowerPoint’e çevir","sunum.pptx"),
 pdf2txt:T("PDF → Metin","Bir PDF seç ya da buraya bırak","Seçilebilir metni .txt olarak çıkarır","Metni çıkar","metin.txt"),
 compress:T("Sıkıştır","Bir PDF seç ya da buraya bırak","Sayfalar görsele çevrilir; metin seçilemez olur","PDF’yi sıkıştır","sikistirilmis.pdf",{opts:[{id:"q",label:"Kalite",sel:[["1|0.6","Düşük boyut"],["1.5|0.7","Dengeli"],["2|0.8","Yüksek kalite"]]}]}),
 repair:T("Onar","Bir PDF seç ya da buraya bırak","Hatalı ya da bozuk PDF’yi yeniden kurmayı dener","PDF’yi onar","onarilmis.pdf"),
 sign:T("İmzala","Bir PDF seç ya da buraya bırak","İmzanı çiz ya da yaz, sayfaya yerleştir","İmzayı ekle","imzali.pdf",{opts:[{id:"sig",pad:true,label:"İmza"},{id:"spages",label:"Sayfa",sel:[["last","Son sayfa"],["first","İlk sayfa"],["all","Tüm sayfalar"]]},{id:"spos",label:"Konum",sel:[["br","Alt sağ"],["bc","Alt orta"],["bl","Alt sol"],["tr","Üst sağ"]]},{id:"sw",label:"Genişlik",sel:[["170","Orta"],["120","Küçük"],["230","Büyük"]]}]}),
 protect:T("Şifrele","Bir PDF seç ya da buraya bırak","PDF’yi açmak için parola ister","PDF’yi şifrele","sifreli.pdf",{opts:[{id:"pw",label:"Parola",pw:true},{id:"pw2",label:"Parola (tekrar)",pw:true}]}),
 unlock:T("Kilidi aç","Bir PDF seç ya da buraya bırak","Parolayı ve kısıtlamaları kaldırır; parolayı bilmen gerekir","Kilidi aç","kilitsiz.pdf",{opts:[{id:"pw",label:"Parola (yalnızca kısıtlama varsa boş bırak)",pw:true}]})
};
let tool="merge", files=[], dl=null;
const $=id=>document.getElementById(id);
const msg=(t,e)=>{$("msg").textContent=t;$("msg").className="msg"+(e?" err":"")};
const size=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const val=id=>$(id).value;

function renderOpts(){
  const o=$("opts");o.innerHTML="";
  for(const f of TOOLS[tool].opts||[]){
    const l=document.createElement("label");l.textContent=f.label;
    if(f.pad){o.appendChild(sigPad());continue}
    let x;
    if(f.sel){x=document.createElement("select");f.sel.forEach(([v,t])=>{const op=document.createElement("option");op.value=v;op.textContent=t;x.appendChild(op)})}
    else{x=document.createElement("input");x.type=f.pw?"password":"text";if(f.pw)x.autocomplete="new-password";x.placeholder=f.ph||"";x.value=f.val||""}
    x.id=f.id;l.appendChild(x);o.appendChild(l);
  }
}
// İmza alanı: çizim ya da yazı
let sig={mode:"draw",ink:false};
function sigPad(){
  sig={mode:"draw",ink:false};
  const box=document.createElement("div");box.className="sigbox";
  box.innerHTML='<div class="seg"><button type="button" data-m="draw" aria-pressed="true">Çiz</button><button type="button" data-m="type" aria-pressed="false">Yaz</button></div><canvas id="sigc" aria-label="İmza alanı"></canvas><input type="text" id="sigt" placeholder="Adını yaz" hidden><div class="bot"><span id="sigh">Fareyle ya da parmağınla imzala</span><button type="button" class="sigclr">Temizle</button></div>';
  const c=box.querySelector("canvas"),t=box.querySelector("#sigt"),ctx=()=>c.getContext("2d");
  const setup=()=>{const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);const x=ctx();x.setTransform(d,0,0,d,0,0);x.lineWidth=2.6;x.lineCap=x.lineJoin="round";x.strokeStyle="#10204a";sig.ink=false;if(sig.mode==="type")typed()};
  const typed=()=>{const r=c.getBoundingClientRect(),x=ctx();x.clearRect(0,0,r.width,r.height);const v=t.value.trim();sig.ink=!!v;if(!v)return;
    let fs=64;x.fillStyle="#10204a";do{x.font="italic "+fs+"px 'Segoe Script','Brush Script MT','Snell Roundhand','Apple Chancery',cursive";fs-=2}while(x.measureText(v).width>r.width-30&&fs>14);
    x.textBaseline="middle";x.textAlign="center";x.fillText(v,r.width/2,r.height/2)};
  let last=null;
  const pt=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{if(sig.mode!=="draw")return;c.setPointerCapture(e.pointerId);last=pt(e);const x=ctx();x.beginPath();x.arc(last[0],last[1],1.3,0,7);x.fillStyle="#10204a";x.fill();sig.ink=true};
  c.onpointermove=e=>{if(!last)return;const p=pt(e),x=ctx();x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p};
  c.onpointerup=c.onpointercancel=()=>last=null;
  t.oninput=typed;
  box.querySelector(".sigclr").onclick=()=>{t.value="";setup()};
  box.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{sig.mode=b.dataset.m;box.querySelectorAll(".seg button").forEach(z=>z.setAttribute("aria-pressed",z===b));t.hidden=sig.mode!=="type";box.querySelector("#sigh").textContent=sig.mode==="type"?"Yazdığın ad el yazısı olarak eklenir":"Fareyle ya da parmağınla imzala";setup();if(!t.hidden)t.focus()});
  requestAnimationFrame(setup);
  return box;
}
// İmzayı kenar boşluklarından kırpıp PNG olarak verir
async function sigPNG(){
  const c=$("sigc");if(!c||!sig.ink)throw new Error("Önce imzanı çiz ya da adını yaz.");
  const d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)throw new Error("Önce imzanı çiz ya da adını yaz.");
  const pad=6,o=document.createElement("canvas");x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(c.width-1,x1+pad);y1=Math.min(c.height-1,y1+pad);
  o.width=x1-x0+1;o.height=y1-y0+1;o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return new Uint8Array(await (await new Promise(r=>o.toBlob(r,"image/png"))).arrayBuffer());
}
function renderList(){
  const ul=$("list");ul.innerHTML="";
  files.forEach((f,i)=>{
    const li=document.createElement("li");
    li.innerHTML='<span class="n"></span><small>'+size(f.size)+'</small>';

function parseRange(s,max,optional){
  if(!s.trim()&&optional)return Array.from({length:max},(_,i)=>i);
  const out=[];
  for(const part of s.split(",").map(p=>p.trim()).filter(Boolean)){
    const m=part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
    if(!m)throw new Error("Aralık biçimi anlaşılmadı: “"+part+"”. Örnek: 1-3, 5");
    const a=+m[1],b=m[2]?+m[2]:a;

    for(let i=a;i<=b;i++)out.push(i-1);

}

    const bytes=Uint8Array.from(atob(m[2]),c=>c.charCodeAt(0));let im;try{im=m[1].toLowerCase()==="png"?await doc.embedPng(bytes):await doc.embedJpg(bytes)}catch(e){return}
    let w=Math.min(U,im.width*.75),h=w*im.height/im.width;if(h>PH-2*M){h=PH-2*M;w=h*im.width/im.height}room(h+6);pg.drawImage(im,{x:M,y:y-h,width:w,height:h});y-=h+6};
  const drawLines=async(lines,size,x0,width,prefix)=>{let first=true;
    for(const l of lines){if(l.img){await drawImg(l.img);continue}
      room(l.h);let x=x0;const base=y-size*1.1;
      if(first&&prefix){const pw=F.r.widthOfTextAtSize(prefix,size);pg.drawText(prefix,{x:x0-pw-6,y:base,size,font:F.r,color:ink})}
      for(const g of merge(l.w)){pg.drawText(g.t,{x,y:base,size,font:g.ft,color:g.st.u?rgb(.05,.3,.8):ink});
        if(g.st.u)pg.drawLine({start:{x,y:base-1.5},end:{x:x+g.w,y:base-1.5},thickness:.5,color:rgb(.05,.3,.8)});x+=g.w}
      y-=l.h;first=false}};
  const HS={H1:22,H2:18,H3:15,H4:13,H5:12,H6:11};
  const table=async tb=>{const trs=[...tb.querySelectorAll("tr")];if(!trs.length)return;
    const grid=trs.map(tr=>[...tr.children].filter(c=>/^T[DH]$/.test(c.tagName)));const nc=Math.max(...grid.map(r=>r.length));if(!nc)return;
    const size=9.5,P=4,cw=U/nc;
    for(const r of grid){const cells=r.map(c=>layout(runs(c,{b:c.tagName==="TH"}),size,cw*(+c.getAttribute("colspan")||1)-2*P).filter(l=>!l.img));
      const rh=Math.max(size*1.45,...cells.map(ls=>ls.reduce((a,l)=>a+l.h,0)))+2*P;room(rh);let x=M;
      r.forEach((c,j)=>{const span=Math.min(+c.getAttribute("colspan")||1,nc),w=cw*span;
        pg.drawRectangle({x,y:y-rh,width:w,height:rh,borderColor:rgb(.7,.7,.73),borderWidth:.5,color:c.tagName==="TH"?rgb(.93,.94,.96):undefined});
        let yy=y-P;for(const l of cells[j]){let xx=x+P;for(const g of merge(l.w)){pg.drawText(g.t,{x:xx,y:yy-size*1.1,size,font:g.ft,color:ink});xx+=g.w}yy-=l.h}x+=w});
      y-=rh}y-=8};
  const list=async(el,depth)=>{let k=0;for(const li of el.children){if(li.tagName!=="LI")continue;k++;
    const x0=M+18*(depth+1),pre=el.tagName==="OL"?k+".":"•";
    await drawLines(layout(runs(li),11,U-18*(depth+1)),11,x0,0,pre);y-=3;
    for(const sub of li.children)if(sub.tagName==="UL"||sub.tagName==="OL")await list(sub,depth+1)}};
  const blocks=async el=>{for(const c of el.childNodes){
    if(c.nodeType===3){if(c.textContent.trim())await drawLines(layout([{t:c.textContent,st:{}}],11,U),11,M);continue}
    if(c.nodeType!==1)continue;const tg=c.tagName;
    if(HS[tg]){y-=HS[tg]*.5;room(HS[tg]*3);await drawLines(layout(runs(c),HS[tg],U),HS[tg],M);y-=4}
    else if(tg==="UL"||tg==="OL"){await list(c,0);y-=6}
    else if(tg==="TABLE")await table(c);
    else if(tg==="P"||tg==="LI"){const rs=runs(c);if(rs.some(r=>r.img||r.br||(r.t&&r.t.trim()))){await drawLines(layout(rs,11,U),11,M);y-=7}else y-=11*1.45}
    else await blocks(c)}};
  await blocks(dom);
  return {data:await doc.save(),name:base(f)+".pdf",note:html.trim()?"":" · Belge boş görünüyor"};
}

// PDF → PowerPoint: her sayfa görüntü olarak bir slayta yerleşir
async function pdf2ppt(f){
  const doc=await pdfjs(f),n=doc.numPages;await need("PptxGenJS",PPTX);
  const p0=(await doc.getPage(1)).getViewport({scale:1}),W=10,H=W*p0.height/p0.width;
  const ppt=new PptxGenJS();ppt.defineLayout({name:"PDF",width:W,height:H});ppt.layout="PDF";
  for(let i=1;i<=n;i++){msg("Sayfa "+i+"/"+n+"…");const {c,w,h}=await renderPage(doc,i,2),r=Math.min(W/(w/72),H/(h/72)),iw=w/72*r,ih=h/72*r;
    const url=await new Promise(ok=>{const fr=new FileReader();jpeg(c,.88).then(b=>{fr.onload=()=>ok(fr.result);fr.readAsDataURL(b)})});
    ppt.addSlide().addImage({data:url,x:(W-iw)/2,y:(H-ih)/2,w:iw,h:ih})}
  const data=await ppt.write({outputType:"blob"});
  return {data:new Blob([data],{type:"application/vnd.openxmlformats-officedocument.presentationml.presentation"}),name:base(f)+".pptx",note:" · Slaytlar sayfa görüntüsüdür"};
}

// Şifrele / Kilidi aç: şifrelemeyi destekleyen pdf-lib sürümü ayrı yüklenir
let CL=null;
async function cantoo(){if(CL)return CL;const keep=window.PDFLib;try{window.PDFLib=undefined;await loadScript(CANTOO);CL=window.PDFLib}finally{window.PDFLib=keep}if(!CL)throw new Error("Şifreleme bileşeni yüklenemedi.");return CL}
async function security(f){
  const L=await cantoo(),bytes=await buf(f),pw=val("pw");
  if(tool==="protect"){
    if(pw.length<4)throw new Error("Parola en az 4 karakter olmalı.");
    if(pw!==val("pw2"))throw new Error("Parolalar eşleşmiyor.");
    let d;try{d=await L.PDFDocument.load(bytes)}catch(e){if(/encrypt/i.test(e.message||""))throw new Error("Bu PDF zaten şifreli. Önce “Kilidi aç” aracını kullan.");throw e}
    d.encrypt({userPassword:pw,ownerPassword:pw,permissions:{printing:"highResolution",modifying:true,copying:true,annotating:true,fillingForms:true,contentAccessibility:true,documentAssembly:true}});
    return {data:await d.save(),name:base(f)+"-sifreli.pdf",note:" · Parolanı unutma; kurtarılamaz"};
  }
  try{await L.PDFDocument.load(bytes);throw Object.assign(new Error("Bu PDF şifreli değil; kaldırılacak bir kilit yok."),{plain:true})}catch(e){if(e.plain)throw e;if(!/encrypt/i.test(e.message||""))throw e}
  let d;try{d=await L.PDFDocument.load(bytes,{password:pw})}catch(e){throw new Error(/password/i.test(e.message||"")?(pw?"Parola yanlış.":"Bu PDF açılış parolası istiyor; parolayı gir."):"PDF açılamadı: "+e.message)}
  return {data:await d.save(),name:base(f)+"-kilitsiz.pdf"};
}

// Onar: önce yapıyı yeniden kurar, olmazsa sayfaları görüntü olarak yeniden oluşturur
async function repair(f){
  const bytes=await buf(f);
  try{const src=await PDFDocument.load(bytes,{throwOnInvalidObject:false,updateMetadata:false});const n=src.getPageCount();if(!n)throw 0;
    const out=await PDFDocument.create();(await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
    return {data:await out.save(),name:base(f)+"-onarilmis.pdf",note:" · Yapı yeniden kuruldu ("+n+" sayfa)"}}
  catch(e){if(e&&/encrypt/i.test(e.message||""))throw e}
  let doc;try{doc=await pdfjs(f)}catch(e){if(e&&e.name==="PasswordException")throw e;throw new Error("PDF onarılamadı; dosya çok hasarlı.")}
  const out=await PDFDocument.create();let ok=0;
  for(let i=1;i<=doc.numPages;i++){msg("Sayfa "+i+"/"+doc.numPages+"…");try{const {c,w,h}=await renderPage(doc,i,2),img=await out.embedJpg(await (await jpeg(c,.85)).arrayBuffer());out.addPage([w,h]).drawImage(img,{x:0,y:0,width:w,height:h});ok++}catch(e){}}
  if(!ok)throw new Error("PDF onarılamadı; dosya çok hasarlı.");
  return {data:await out.save(),name:base(f)+"-onarilmis.pdf",note:" · "+ok+" sayfa görüntü olarak kurtarıldı; metin seçilemez"};
}
const jpeg=(c,q)=>new Promise(r=>c.toBlob(r,"image/jpeg",q));

async function run(){
  const f=files[0];
  if(tool==="xls2pdf")return xls2pdf(f);
  if(tool==="pdf2word")return pdf2word(f);
  if(tool==="word2pdf")return word2pdf(f);
  if(tool==="pdf2ppt")return pdf2ppt(f);
  if(tool==="protect"||tool==="unlock")return security(f);
  if(tool==="repair")return repair(f);
  if(tool==="pdf2xls")return pdf2xls(f);
  if(tool==="merge"||tool==="img"){
    const out=await PDFDocument.create();
    for(const x of files){
      if(tool==="merge"){const src=await load(x);(await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p))}
      else{const img=x.type==="image/png"?await out.embedPng(await buf(x)):await out.embedJpg(await buf(x));
        out.addPage([img.width,img.height]).drawImage(img,{x:0,y:0,width:img.width,height:img.height})}
    }
    return {data:await out.save()};
  }
  if(tool==="split"||tool==="remove"||tool==="organize"){
    const src=await load(f),n=src.getPageCount(),r=parseRange(val("range"),n);
    const idx=tool==="remove"?src.getPageIndices().filter(i=>!r.includes(i)):r;
    if(!idx.length)throw new Error("Silince hiç sayfa kalmıyor.");
    const out=await PDFDocument.create();
    (await out.copyPages(src,idx)).forEach(p=>out.addPage(p));
    return {data:await out.save()};
  }
  if(["rotate","numbers","watermark","crop","text","sign"].includes(tool)){
    const doc=await load(f),pages=doc.getPages(),n=pages.length;
    if(tool==="rotate"){const d=+val("deg");parseRange(val("range"),n,true).forEach(i=>pages[i].setRotation(degrees((pages[i].getRotation().angle+d)%360)))}
    if(tool==="numbers"){
      const font=await doc.embedFont(StandardFonts.Helvetica),st=parseInt(val("start"))||1,pos=val("pos");
      pages.forEach((p,i)=>{const {width}=p.getSize(),t=(st+i)+(val("fmt")==="t"?" / "+(st+n-1):""),w=font.widthOfTextAtSize(t,11);
        p.drawText(t,{x:pos==="l"?36:pos==="r"?width-36-w:(width-w)/2,y:24,size:11,font,color:rgb(.2,.2,.2)})});
    }
    if(tool==="watermark"){
      const t=val("wm").replace(/\s+/g," ").trim();if(!t)throw new Error("Filigran metni boş kalamaz.");
      const font=await noto(doc,"Bold"),op=+val("op"),a=Math.PI/4;
      pages.forEach(p=>{const {width,height}=p.getSize(),sz=Math.min(90,width*.7/font.widthOfTextAtSize(t,1)),tw=font.widthOfTextAtSize(t,sz),th=sz*.35;
        p.drawText(t,{x:width/2-tw/2*Math.cos(a)+th*Math.sin(a),y:height/2-tw/2*Math.sin(a)-th*Math.cos(a),size:sz,font,rotate:degrees(45),color:rgb(.5,.5,.5),opacity:op})});
    }
    if(tool==="text"){
      const t=val("txt").replace(/\s+/g," ").trim();if(!t)throw new Error("Eklenecek metni yaz.");
      const font=await noto(doc,"Regular"),sz=+val("tsz"),pos=val("tpos"),[r,g,b]=val("tcol").split(",").map(Number),M=36;
      parseRange(val("range"),n,true).forEach(i=>{const p=pages[i],{width,height}=p.getSize(),w=font.widthOfTextAtSize(t,sz);
        const x=pos[1]==="l"?M:pos[1]==="r"?width-M-w:(width-w)/2,y=pos[0]==="t"?height-M-sz:pos[0]==="b"?M:(height-sz)/2;
        p.drawText(t,{x,y,size:sz,font,color:rgb(r,g,b)})});
    }
    if(tool==="sign"){
      const png=await doc.embedPng(await sigPNG()),sw=+val("sw"),sp=val("spages"),pos=val("spos"),M=36;
      const idx=sp==="all"?pages.map((_,i)=>i):[sp==="first"?0:n-1];
      idx.forEach(i=>{const p=pages[i],{width,height}=p.getSize(),w=Math.min(sw,width-2*M),h=w*png.height/png.width;
        p.drawImage(png,{x:pos[1]==="l"?M:pos[1]==="r"?width-M-w:(width-w)/2,y:pos[0]==="t"?height-M-h:M,width:w,height:h})});
    }
    if(tool==="crop"){
      const m=parseFloat(val("m"));if(!(m>0))throw new Error("Kesilecek miktarı gir (pt).");
      pages.forEach(p=>{const {width,height}=p.getSize();if(width<=2*m||height<=2*m)throw new Error("Kenar payı sayfa boyutundan büyük.");p.setCropBox(m,m,width-2*m,height-2*m)});
    }
    return {data:await doc.save()};
  }
  const doc=await pdfjs(f),n=doc.numPages;
  if(tool==="pdf2jpg"){
    const zip=new JSZip();
    for(let i=1;i<=n;i++){msg("Sayfa "+i+"/"+n+"…");const {c}=await renderPage(doc,i,2);zip.file(base(f)+"-"+i+".jpg",await jpeg(c,.9))}
    return {data:await zip.generateAsync({type:"blob"}),name:base(f)+"-sayfalar.zip"};
  }
  if(tool==="pdf2txt"){
    let all="",any=false;
    for(let i=1;i<=n;i++){const tc=await (await doc.getPage(i)).getTextContent(),t=tc.items.map(x=>x.str).join(" ").trim();if(t)any=true;all+="--- Sayfa "+i+" ---\n"+t+"\n\n"}
    if(!any)throw new Error("Metin bulunamadı. Bu PDF taranmış görsellerden oluşuyor olabilir; OCR bu sürümde yok.");
    return {data:all,type:"text/plain",name:base(f)+".txt"};
  }
  const [sc,q]=val("q").split("|").map(Number),out=await PDFDocument.create();
  for(let i=1;i<=n;i++){msg("Sayfa "+i+"/"+n+"…");const {c,w,h}=await renderPage(doc,i,sc),img=await out.embedJpg(await (await jpeg(c,q)).arrayBuffer());
    out.addPage([w,h]).drawImage(img,{x:0,y:0,width:w,height:h})}
  const data=await out.save(),pct=Math.round(100-data.length/f.size*100);
  return {data,note:pct>0?" · %"+pct+" küçüldü":" · Boyut küçülmedi; zaten verimli bir PDF olabilir"};
}

async function save(name,blob){
  if(window.claude&&!dl)dl=await claude.use("downloads");
  if(dl)return dl.save({filename:name,data:blob});
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}
$("go").onclick=async()=>{
  $("go").disabled=true;msg("İşleniyor…");
  try{
    const r=await run(),name=r.name||TOOLS[tool].out,type=r.type||(r.data instanceof Blob?r.data.type:"application/pdf");
    const blob=r.data instanceof Blob?r.data:new Blob([r.data],{type});
    await save(name,blob);
    msg("Hazır: "+name+" ("+size(blob.size)+")"+(r.note||""));
  }catch(e){
    if(e&&e.code==="declined")msg("Kaydetme iptal edildi.");
    else if(e&&(/encrypt/i.test(e.message||"")||e.name==="PasswordException"))msg("Bu PDF şifreli. Önce “Kilidi aç” aracıyla parolayı kaldır.",true);
    else msg(e&&e.message?e.message:"İşlem başarısız oldu. Dosya bozuk olabilir.",true);
  }finally{$("go").disabled=!files.length}
};
const CATS={org:["Sayfaları düzenle","#E5322D"],opt:["Optimize et","#16A34A"],cvt:["Dönüştür","#E58A00"],edt:["PDF’yi düzenle","#7C5CFC"],sec:["Güvenlik","#2563EB"]};
const KIND={merge:"org",split:"org",remove:"org",organize:"org",compress:"opt",repair:"opt",img:"cvt",pdf2word:"cvt",word2pdf:"cvt",pdf2ppt:"cvt",pdf2jpg:"cvt",pdf2xls:"cvt",xls2pdf:"cvt",pdf2txt:"cvt",rotate:"edt",numbers:"edt",watermark:"edt",text:"edt",crop:"edt",sign:"sec",protect:"sec",unlock:"sec"};

const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+IC[k]+'"/></svg>';
function buildHome(){

  }
}
